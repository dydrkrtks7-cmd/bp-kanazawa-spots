<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="312" cy="-75" r="81" fill="#1565c0" opacity="0.16"/>
    <circle cx="1280" cy="162" r="48" fill="#1565c0" opacity="0.18"/>
    <circle cx="115" cy="619" r="88" fill="#1565c0" opacity="0.12"/>
    <circle cx="1014" cy="706" r="75" fill="#1565c0" opacity="0.10"/>
    <circle cx="5" cy="651" r="27" fill="#1565c0" opacity="0.16"/>
    <circle cx="942" cy="-15" r="22" fill="#1565c0" opacity="0.15"/>
    <rect x="364" y="-97" width="37" height="87" rx="8" fill="#0d47a1" opacity="0.08" transform="rotate(39, 1250, 409)"/>
    <rect x="803" y="259" width="30" height="22" rx="8" fill="#0d47a1" opacity="0.14" transform="rotate(5, 208, 171)"/>
    <rect x="1159" y="4" width="43" height="77" rx="8" fill="#0d47a1" opacity="0.08" transform="rotate(28, 785, 483)"/>
    <rect x="471" y="212" width="74" height="59" rx="8" fill="#0d47a1" opacity="0.11" transform="rotate(16, 982, 515)"/>
    <rect x="660" y="496" width="64" height="84" rx="8" fill="#0d47a1" opacity="0.04" transform="rotate(30, 430, 338)"/>
    <rect x="1103" y="694" width="84" height="98" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(17, 559, 611)"/>
    <rect x="239" y="433" width="70" height="81" rx="8" fill="#0d47a1" opacity="0.04" transform="rotate(17, 658, 244)"/>
    <rect x="1159" y="612" width="47" height="65" rx="8" fill="#0d47a1" opacity="0.13" transform="rotate(35, 665, 475)"/>
    <polygon points="926,193 1004,349 848,349" fill="#1565c0" opacity="0.09"/>
    <polygon points="1137,520 1183,612 1091,612" fill="#1565c0" opacity="0.09"/>
    <polygon points="819,497 914,687 724,687" fill="#1565c0" opacity="0.10"/>
    <polygon points="78,548 138,668 18,668" fill="#1565c0" opacity="0.05"/>

  <!-- Wave at bottom -->
  <path d="M0,574 C360,602 840,546 1200,574 L1200,630 L0,630Z" fill="#1565c0" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Kanazawa spots 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Kanazawa — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Kanazawa Kanazawa spots 안내 — 정보
  </text>
</svg>